name: Set Render env var and deploy

on:
  workflow_dispatch:

jobs:
  set-env-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Render API access
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://api.render.com/v1/services/srv-dc12pe56e07s73c3skh0" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json")
          echo "get service HTTP: $CODE"
      - name: Set OPENROUTER_API_KEY on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          BODY=$(jq -n --arg v "$OPENROUTER_API_KEY" '{value: $v}')
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT "https://api.render.com/v1/services/srv-dc12pe56e07s73c3skh0/env-vars/OPENROUTER_API_KEY" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          echo "set env var HTTP: $CODE"
          test "$CODE" -ge 200 -a "$CODE" -lt 300
      - name: Trigger Render deploy
        if: always()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.render.com/v1/services/srv-dc12pe56e07s73c3skh0/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}')
          echo "trigger deploy HTTP: $CODE"
          test "$CODE" -ge 200 -a "$CODE" -lt 300
