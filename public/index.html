<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7fb" />
    <title>مِداد | مساعدك الذكي بالعربية</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="chat-shell">
      <header class="topbar">
        <button id="menu-button" class="menu-button" type="button" aria-label="فتح القائمة" aria-expanded="false" aria-controls="sidebar">☰</button>
        <div class="brand-mark" aria-hidden="true">✒️</div>
        <div>
          <h1>مِداد</h1>
          <p>قلمك الذكي — مساعد بالعربية</p>
        </div>
        <span class="model-badge">✦ ذكي</span>
      </header>


      <section id="messages" class="messages" aria-label="سجل المحادثة" aria-live="polite">
        <div class="welcome-card" id="welcome">
          <div class="welcome-icon" aria-hidden="true">✦</div>
          <h2>أهلًا بك في مِداد!</h2>
          <p>اكتب سؤالك أو فكرتك، وسأساعدك بكل سرور.</p>
        </div>
      </section>


      <div id="image-preview" class="image-preview" hidden>
        <img id="image-preview-thumbnail" alt="معاينة الصورة المرفقة" />
        <button id="remove-image-button" class="remove-image-button" type="button" aria-label="إزالة الصورة">✕</button>
      </div>
      <p id="image-mode-hint" class="image-mode-hint" role="status" hidden>سيتم توليد صورة من رسالتك التالية</p>
      <p id="song-mode-hint" class="song-mode-hint" role="status" hidden>سيتم توليد أغنية من رسالتك التالية</p>
      <div id="voiceprint-row" class="voiceprint-row" hidden>
        <span id="voiceprint-status" class="voiceprint-status" role="status"></span>
        <div class="voiceprint-buttons">
          <button id="voiceprint-record-button" class="voiceprint-button" type="button">🎤 سجّل صوتك</button>
          <button id="voiceprint-upload-button" class="voiceprint-button" type="button">📁 ارفع مقطعًا صوتيًا</button>
          <button id="voiceprint-stop-button" class="voiceprint-button" type="button" hidden>⏹ إيقاف</button>
          <button id="voiceprint-play-button" class="voiceprint-button" type="button" hidden>▶ استمع</button>
          <button id="voiceprint-delete-button" class="voiceprint-button danger" type="button" hidden>🗑 حذف</button>
        </div>
        <input id="voiceprint-file-input" class="visually-hidden" type="file" accept="audio/*" />
      </div>
      <input id="image-input" class="visually-hidden" type="file" accept="image/*" />
      <form id="chat-form" class="composer">
        <label class="visually-hidden" for="message-input">اكتب رسالتك</label>
        <button id="plus-button" class="plus-button" type="button" aria-label="خيارات إضافية" aria-expanded="false" aria-controls="plus-menu">+</button>
        <div id="plus-menu" class="plus-menu" hidden>
          <button type="button" id="plus-song-button"><span>🎵</span> توليد أغنية</button>
          <button type="button" id="plus-image-button"><span>🎨</span> توليد صورة</button>
          <button type="button" id="plus-attach-button"><span>📎</span> إرفاق صورة</button>
        </div>
        <textarea id="message-input" rows="1" maxlength="8000" placeholder="اكتب رسالتك هنا..."></textarea>
        <button id="send-button" class="send-button" type="submit" aria-label="إرسال الرسالة">
          <span aria-hidden="true">➤</span>
        </button>
      </form>
      <p class="footnote">قد تكون إجابات الذكاء الاصطناعي غير دقيقة أحيانًا.</p>


      <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="إغلاق القائمة" hidden></button>
      <aside id="sidebar" class="sidebar" aria-label="القائمة" aria-hidden="true" inert>
        <div class="sidebar-header">
